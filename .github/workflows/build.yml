name: Build Cepheus Kernel + KSU

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential flex bison libyaml-dev pkg-config \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi libssl-dev libelf-dev bc \
            python2 python3 git zip curl wget
          sudo ln -sf /usr/bin/python2 /usr/bin/python

      - name: Setup Clang
        run: |
          mkdir -p $HOME/clang
          wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r522817.tar.gz -O clang.tar.gz
          tar -xf clang.tar.gz -C $HOME/clang
          echo "$HOME/clang/bin" >> $GITHUB_PATH

      - name: Clone kernel source
        run: git clone --depth=1 https://github.com/Spark-Devices/android_kernel_xiaomi_cepheus -b pyro kernel

      - name: Setup KernelSU
        run: |
          cd kernel
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s v1.0.5
      
      - name: Add path_umount stub
        run: |
          cd kernel
          if ! grep -q "int path_umount" fs/namespace.c; then
            printf '\nint path_umount(struct path *path, int flags)\n{\n\tpath_put(path);\n\treturn 0;\n}\nEXPORT_SYMBOL_GPL(path_umount);\n' >> fs/namespace.c
            echo "path_umount ditambahkan di namespace.c"
          else
            echo "path_umount sudah ada"
          fi

      - name: Edit defconfig
        run: |
          cd kernel
          DEFCONFIG="arch/arm64/configs/cepheus_defconfig"
          
          # Hapus config yang mau di-override
          sed -i '/CONFIG_KSU/d' "$DEFCONFIG"
          sed -i '/CONFIG_RMNET_SHS/d' "$DEFCONFIG"
          sed -i '/CONFIG_RMNET_PERF/d' "$DEFCONFIG"

          # Tambah config minimal
          echo "CONFIG_KSU=y" >> "$DEFCONFIG"
          echo "CONFIG_KALLSYMS=y" >> "$DEFCONFIG"
          echo "CONFIG_KALLSYMS_ALL=y" >> "$DEFCONFIG"
          echo "# CONFIG_RMNET_SHS is not set" >> "$DEFCONFIG"
          echo "# CONFIG_RMNET_PERF is not set" >> "$DEFCONFIG"
          echo "DEFCONFIG_NAME=cepheus_defconfig" >> $GITHUB_ENV

      - name: Build kernel
        run: |
          cd kernel
          export PATH="$HOME/clang/bin:$PATH"
          export KCONFIG_NOTIMESTAMP=y

          # Fix DTC yaml
          sed -i 's/yamltree\.o//' scripts/dtc/Makefile
          sed -i '/dt_to_yaml/c\			/* yaml output disabled */' scripts/dtc/dtc.c
          echo 'void dt_to_yaml(void *dti, void *f) {}' >> scripts/dtc/yamltree.c

          make O=out ARCH=arm64 $DEFCONFIG_NAME
          make O=out ARCH=arm64 olddefconfig
          make -j$(nproc) O=out ARCH=arm64 \
            CC=clang \
            LLVM=1 \
            LLVM_IAS=1 \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            HOSTCC=gcc \
            HOSTCXX=g++ \
            HOSTLD=ld \
            KCFLAGS="-Wno-implicit-function-declaration -Wno-error" \
            Image.gz-dtb dtbo.img 2>&1 | tee build.log

      - name: Pack AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3
          cp anykernel.sh AnyKernel3/anykernel.sh
          IMG=kernel/out/arch/arm64/boot

          echo "=== Cek file kernel ==="
          ls -lh $IMG/Image* $IMG/dtbo.img 2>/dev/null || echo "Kernel belum ada!"

          if [ -f "$IMG/Image.gz-dtb" ]; then
            cp "$IMG/Image.gz-dtb" AnyKernel3/Image.gz-dtb
            echo "Pakai Image.gz-dtb"
          elif [ -f "$IMG/Image.gz" ]; then
            cp "$IMG/Image.gz" AnyKernel3/Image.gz-dtb
            echo "Pakai Image.gz"
          else
            echo "ERROR: Kernel image tidak ditemukan!"
            exit 1
          fi

          if [ -f "$IMG/dtbo.img" ]; then
            cp "$IMG/dtbo.img" AnyKernel3/
            echo "dtbo.img ketemu"
          else
            echo "WARNING: dtbo.img tidak ada, bisa bootloop!"
          fi

          cd AnyKernel3 && zip -r9 ../Cepheus-KSU-$(date +%Y%m%d).zip * -x "*.git*"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cepheus-Kernel-KSU
          path: Cepheus-KSU-*.zip
