name: Build Cepheus Kernel + KSUN + SUSFS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y git curl wget zip unzip bc bison flex libssl-dev libelf-dev libncurses-dev python3 build-essential gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi libyaml-dev

      - name: Setup Clang
        run: |
          mkdir -p $HOME/clang
          wget -q https://github.com/ZyCromerZ/Clang/releases/download/17.0.0-20230725-release/Clang-17.0.0-20230725.tar.gz -O clang.tar.gz
          tar -xf clang.tar.gz -C $HOME/clang
          echo "$HOME/clang/bin" >> $GITHUB_PATH

      - name: Clone kernel source
        run: git clone --depth=1 https://github.com/Spark-Devices/android_kernel_xiaomi_cepheus -b pyro kernel

      - name: Clone KernelSU-Next
        run: git clone --depth=1 https://github.com/KernelSU-Next/KernelSU-Next.git kernel/KernelSU-Next

      - name: Patch KSUN manually
        run: |
          cd kernel
          cp -r KernelSU-Next/kernel KSU
          echo 'obj-$(CONFIG_KSU) += ../KSU/' >> drivers/Makefile
          echo 'source "KSU/Kconfig"' >> drivers/Kconfig

      - name: Apply SUSFS patch
        run: |
          cd kernel
          sed -i 's/yaml-src = yamltree.c/yaml-src =/' scripts/dtc/Makefile || true
          sed -i 's/$(yaml-objs)//' scripts/dtc/Makefile || true
          sed -i '/libyaml/d' scripts/dtc/Makefile || true
          sed -i 's/EXTRA_LIBS += -lyaml//' scripts/dtc/Makefile || true
          sed -i '/LITTLE_CPU_MASK/d' kernel/Kconfig || true
          sed -i '/BIG_CPU_MASK/d' kernel/Kconfig || true  
          sed -i '/PRIME_CPU_MASK/d' kernel/Kconfig || true
          grep -r "LITTLE_CPU_MASK\|BIG_CPU_MASK\|PRIME_CPU_MASK" --include="Kconfig" -l | xargs sed -i '/CPU_MASK/d' || true
          git clone --depth=1 https://gitlab.com/simonpunk/susfs4ksu.git -b kernel-4.14 susfs_patch
          cp susfs_patch/kernel_patches/50_add_susfs_in_kernel-4.14.patch .
          patch -p1 --forward < 50_add_susfs_in_kernel-4.14.patch || true
          cp susfs_patch/kernel_patches/fs/* fs/ || true
          cp susfs_patch/kernel_patches/include/linux/* include/linux/ || true

      - name: Disable DTC YAML
        run: |
          cd kernel
          sed -i 's/yamltree.o//' scripts/dtc/Makefile
          sed -i 's/#include <yaml.h>/\/\/ yaml disabled/' scripts/dtc/dtc.h 2>/dev/null || true
          sed -i 's/WITH_YAML/WITHOUT_YAML/g' scripts/dtc/Makefile 2>/dev/null || true
          grep -r "yaml" scripts/dtc/Makefile || echo "yaml removed from Makefile"    

      - name: Fix CPU mask Kconfig
        run: |
          cd kernel
          grep -r "LITTLE_CPU_MASK\|BIG_CPU_MASK\|PRIME_CPU_MASK" --include="Kconfig" -l | xargs -I{} sed -i '/CPU_MASK/d' {} || true    

      - name: Edit defconfig
        run: |
          cd kernel
          DEFCONFIG=arch/arm64/configs/cepheus_user_defconfig
          echo "CONFIG_LITTLE_CPU_MASK=0xf" >> $DEFCONFIG
          echo "CONFIG_BIG_CPU_MASK=0x70" >> $DEFCONFIG
          echo "CONFIG_PRIME_CPU_MASK=0x80" >> $DEFCONFIG
          echo 'CONFIG_LITTLE_CPU_MASK=0x0f' >> $DEFCONFIG
          echo 'CONFIG_BIG_CPU_MASK=0x70' >> $DEFCONFIG
          echo 'CONFIG_PRIME_CPU_MASK=0x80' >> $DEFCONFIG
          echo "CONFIG_KSU=y" >> $DEFCONFIG
          echo "CONFIG_KSU_SUSFS=y" >> $DEFCONFIG
          echo "CONFIG_KSU_SUSFS_SUS_PATH=y" >> $DEFCONFIG
          echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y" >> $DEFCONFIG
          echo "CONFIG_KSU_SUSFS_SUS_KSTAT=y" >> $DEFCONFIG
          echo "CONFIG_KSU_SUSFS_TRY_UMOUNT=y" >> $DEFCONFIG
          echo "CONFIG_KSU_SUSFS_SPOOF_UNAME=y" >> $DEFCONFIG
          echo "CONFIG_KSU_SUSFS_ENABLE_LOG=y" >> $DEFCONFIG
          echo "CONFIG_OVERLAY_FS=y" >> $DEFCONFIG
          echo "CONFIG_KALLSYMS=y" >> $DEFCONFIG
          echo "CONFIG_KALLSYMS_ALL=y" >> $DEFCONFIG

      - name: Build kernel
        run: |
          cd kernel
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH="$HOME/clang/bin:$PATH"
          export KCONFIG_NOTIMESTAMP=y
          make O=out ARCH=arm64 cepheus_user_defconfig
          make O=out ARCH=arm64 olddefconfig KCONFIG_ALLCONFIG=1
          make -j$(nproc) O=out \
            ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip 2>&1 | tee build.log

      - name: Check output
        run: |
          if [ -f kernel/out/arch/arm64/boot/Image.gz-dtb ]; then
            echo "Image.gz-dtb found"
          elif [ -f kernel/out/arch/arm64/boot/Image ]; then
            echo "Image found"
          else
            echo "No kernel image!"
            tail -100 kernel/build.log
            exit 1
          fi

      - name: Pack AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3
          IMG=kernel/out/arch/arm64/boot
          for f in Image.gz-dtb Image-dtb Image.gz Image; do
            if [ -f "$IMG/$f" ]; then cp "$IMG/$f" AnyKernel3/; break; fi
          done
          sed -i 's/device.name1=.*/device.name1=cepheus/' AnyKernel3/anykernel.sh
          cd AnyKernel3 && zip -r9 ../Cepheus-KSUN-SUSFS-$(date +%Y%m%d).zip * -x "*.git*"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cepheus-Kernel-KSUN-SUSFS
          path: |
            Cepheus-KSUN-SUSFS-*.zip
            kernel/build.log
          retention-days: 7
