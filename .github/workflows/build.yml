name: Build Cepheus Kernel + KSUN + SUSFS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential flex bison libyaml-dev pkg-config \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi libssl-dev libelf-dev bc \
            python2 python3 git zip curl wget
          sudo ln -sf /usr/bin/python2 /usr/bin/python

      - name: Setup Clang
        run: |
          mkdir -p $HOME/clang
          wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r522817.tar.gz -O clang.tar.gz
          tar -xf clang.tar.gz -C $HOME/clang
          echo "$HOME/clang/bin" >> $GITHUB_PATH

      - name: Clone kernel source
        run: git clone --depth=1 https://github.com/Spark-Devices/android_kernel_xiaomi_cepheus -b pyro kernel

      - name: Setup KernelSU-Next
        run: |
          cd kernel
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s v1.0.5

      - name: Apply KernelSU
        run: |
          cd kernel
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s main
          patch -p1 -F3 < patch_susfs4.14.patch || true

      - name: Hapus KernelSU duplikat
        run: |
          cd kernel
          rm -rf driver/kernelsu/
      
      - name: Edit defconfig
        run: |
          cd kernel
          DEFCONFIG="arch/arm64/configs/cepheus_defconfig"
          sed -i '/CONFIG_LITTLE_CPU_MASK/d' "$DEFCONFIG"
          sed -i '/CONFIG_BIG_CPU_MASK/d' "$DEFCONFIG"
          sed -i '/CONFIG_PRIME_CPU_MASK/d' "$DEFCONFIG"
          sed -i '/CONFIG_KSU/d' "$DEFCONFIG"
          sed -i '/CONFIG_SUSFS/d' "$DEFCONFIG"
          sed -i '/CONFIG_HZ_PERIODIC/d' "$DEFCONFIG"
          sed -i '/CONFIG_F2FS_FS/d' "$DEFCONFIG"
          
          echo "CONFIG_LITTLE_CPU_MASK=15" >> $DEFCONFIG
          echo "CONFIG_BIG_CPU_MASK=112" >> $DEFCONFIG
          echo "CONFIG_PRIME_CPU_MASK=128" >> $DEFCONFIG
          echo "CONFIG_KSU=y" >> $DEFCONFIG
          echo "CONFIG_SUSFS=y" >> $DEFCONFIG
          echo "CONFIG_SUSFS_SUS_PATH=y" >> $DEFCONFIG
          echo "CONFIG_SUSFS_SUS_MOUNT=y" >> $DEFCONFIG
          echo "CONFIG_SUSFS_SUS_KSTAT=y" >> $DEFCONFIG
          echo "CONFIG_SUSFS_TRY_UMOUNT=y" >> $DEFCONFIG
          echo "CONFIG_SUSFS_SPOOF_UNAME=y" >> $DEFCONFIG
          echo "CONFIG_SUSFS_ENABLE_LOG=y" >> $DEFCONFIG
          echo "CONFIG_OVERLAY_FS=y" >> $DEFCONFIG
          echo "CONFIG_KALLSYMS=y" >> $DEFCONFIG
          echo "CONFIG_KALLSYMS_ALL=y" >> $DEFCONFIG
          echo "CONFIG_NR_CPUS=8" >> $DEFCONFIG
          echo "CONFIG_NO_HZ_IDLE=y" >> $DEFCONFIG
          echo "CONFIG_HZ_PERIODIC=n" >> $DEFCONFIG
          echo "CONFIG_F2FS_FS=y" >> $DEFCONFIG
          echo "CONFIG_F2FS_STAT_FS=y" >> $DEFCONFIG
          echo "CONFIG_F2FS_FS_XATTR=y" >> $DEFCONFIG
          echo "CONFIG_F2FS_FS_POSIX_ACL=y" >> $DEFCONFIG
          echo "CONFIG_F2FS_FS_SECURITY=y" >> $DEFCONFIG
          echo "CONFIG_F2FS_CHECK_FS=y" >> $DEFCONFIG
          echo "CONFIG_FS_ENCRYPTION=y" >> $DEFCONFIG
          echo "CONFIG_FS_ENCRYPTION_ALGS=y" >> $DEFCONFIG
          echo "CONFIG_PFK=y" >> $DEFCONFIG
          echo "CONFIG_QCOM_ICE=y" >> $DEFCONFIG
          echo "CONFIG_F2FS_FS_COMPRESSION=y" >> $DEFCONFIG
          echo "CONFIG_F2FS_FS_LZ4=y" >> $DEFCONFIG
          echo "CONFIG_F2FS_FS_ZSTD=y" >> $DEFCONFIG
          echo "CONFIG_F2FS_IOSTAT=y" >> $DEFCONFIG
          echo "# CONFIG_RMNET_SHS is not set" >> $DEFCONFIG
          echo "# CONFIG_RMNET_PERF is not set" >> $DEFCONFIG
          echo "DEFCONFIG_NAME=cepheus_defconfig" >> $GITHUB_ENV

      - name: Build kernel
        run: |
          cd kernel
          export PATH="$HOME/clang/bin:$PATH"
          export KCONFIG_NOTIMESTAMP=y
          make O=out ARCH=arm64 $DEFCONFIG_NAME
          make O=out ARCH=arm64 olddefconfig
          make -j$(nproc) O=out ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip KCFLAGS="-Wno-implicit-function-declaration -Wno-error" Image.gz-dtb dtbo.img 2>&1 | tee build.log
     
      - name: Pack AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3
          IMG=kernel/out/arch/arm64/boot
    
          echo "=== Cek file kernel ==="
          ls -lh $IMG/Image* $IMG/dtbo.img 2>/dev/null || echo "Kernel belum ada!"
    
          # Ambil Image.gz-dtb, kalo gaada pake Image.gz
          if [ -f "$IMG/Image.gz-dtb" ]; then
            cp "$IMG/Image.gz-dtb" AnyKernel3/Image.gz-dtb
            echo "Pakai Image.gz-dtb"
          elif [ -f "$IMG/Image.gz" ]; then
            cp "$IMG/Image.gz" AnyKernel3/Image.gz-dtb
            echo "Pakai Image.gz"
          else
            echo "ERROR: Kernel image tidak ditemukan!"
            exit 1
          fi
    
          # Copy dtbo.img wajib buat Mi9
          if [ -f "$IMG/dtbo.img" ]; then
            cp "$IMG/dtbo.img" AnyKernel3/
            echo "dtbo.img ketemu"
          else
            echo "WARNING: dtbo.img tidak ada, bisa bootloop!"
          fi
    
             echo "=== Isi folder AnyKernel3 ==="
             ls -lh AnyKernel3/
    
            sed -i 's/do.devicecheck=.*/do.devicecheck=0/' AnyKernel3/anykernel.sh
            sed -i 's/device.name1=.*/device.name1=cepheus/' AnyKernel3/anykernel.sh
            cd AnyKernel3 && zip -r9 ../Cepheus-KSUN-SUSFS-$(date +%Y%m%d).zip * -x "*.git*"
          
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cepheus-Kernel-KSUN-SUSFS
          path: Cepheus-KSUN-SUSFS-*.zip
