name: Build Cepheus Kernel + KSUN + SUSFS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git curl wget zip unzip bc bison flex \
            libssl-dev libelf-dev libncurses-dev python3 python3-pip \
            build-essential ccache

      - name: Setup Neutron Clang
        run: |
          mkdir -p $HOME/clang
          cd $HOME/clang
          curl -LO "https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman"
          chmod +x antman
          ./antman -S=latest

      - name: Clone kernel source
        run: |
          git clone --depth=1 \
            https://github.com/Spark-Devices/android_kernel_xiaomi_cepheus \
            -b pyro kernel

      - name: Clone KernelSU-Next
        run: |
          cd kernel
          git clone --depth=1 \
            https://github.com/KernelSU-Next/KernelSU-Next.git \
            KernelSU-Next

      - name: Patch KSUN manually
        run: |
          cd kernel
          # Copy KSU kernel files
          cp -r KernelSU-Next/kernel KSU
          # Tambahkan ke drivers/Makefile
          echo 'obj-$(CONFIG_KSU) += ../KSU/' >> drivers/Makefile
          # Tambahkan ke drivers/Kconfig
          echo 'source "KSU/Kconfig"' >> drivers/Kconfig

      - name: Clone and apply SUSFS patch
        run: |
          git clone --depth=1 \
            https://github.com/sidex15/susfs4ksu-module \
            susfs_tmp || true
          cd kernel
          # Apply SUSFS patches untuk kernel 4.14
          git clone --depth=1 \
            https://gitlab.com/simonpunk/susfs4ksu.git \
            -b kernel-4.14 susfs_patch
          cp susfs_patch/kernel_patches/50_add_susfs_in_kernel-4.14.patch .
          patch -p1 < 50_add_susfs_in_kernel-4.14.patch || true
          cp susfs_patch/kernel_patches/fs/* fs/
          cp susfs_patch/kernel_patches/include/linux/* include/linux/

      - name: Edit defconfig
        run: |
          cd kernel
          DEFCONFIG=arch/arm64/configs/cepheus_user_defconfig
          # KSUN configs
          echo "CONFIG_KSU=y" >> $DEFCONFIG
          echo "CONFIG_KSU_SUSFS=y" >> $DEFCONFIG
          echo "CONFIG_KSU_SUSFS_SUS_PATH=y" >> $DEFCONFIG
          echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y" >> $DEFCONFIG
          echo "CONFIG_KSU_SUSFS_SUS_KSTAT=y" >> $DEFCONFIG
          echo "CONFIG_KSU_SUSFS_TRY_UMOUNT=y" >> $DEFCONFIG
          echo "CONFIG_KSU_SUSFS_SPOOF_UNAME=y" >> $DEFCONFIG
          echo "CONFIG_KSU_SUSFS_ENABLE_LOG=y" >> $DEFCONFIG
          # Kernel configs pendukung
          echo "CONFIG_OVERLAY_FS=y" >> $DEFCONFIG
          echo "CONFIG_KALLSYMS=y" >> $DEFCONFIG
          echo "CONFIG_KALLSYMS_ALL=y" >> $DEFCONFIG
          echo "CONFIG_MODULES=y" >> $DEFCONFIG
          echo "CONFIG_MODULE_UNLOAD=y" >> $DEFCONFIG

      - name: Build kernel
        run: |
          cd kernel
          export PATH="$HOME/clang/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export KBUILD_BUILD_USER="quinaalista-glitch"
          export KBUILD_BUILD_HOST="github-actions"
          make O=out ARCH=arm64 cepheus_user_defconfig
          make -j$(nproc) O=out \
            ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            2>&1 | tee build.log

      - name: Pack AnyKernel3
        run: |
          git clone --depth=1 \
            https://github.com/osm0sis/AnyKernel3.git AnyKernel3
          # Cari Image
          IMG_PATH=kernel/out/arch/arm64/boot
          for img in Image.gz-dtb Image-dtb Image.gz Image; do
            if [ -f "$IMG_PATH/$img" ]; then
              cp "$IMG_PATH/$img" AnyKernel3/
              break
            fi
          done
          # Edit anykernel.sh untuk cepheus
          sed -i 's/device.name1=.*/device.name1=cepheus/' AnyKernel3/anykernel.sh
          cd AnyKernel3
          zip -r9 "../Cepheus-KSUN-SUSFS-$(date +%Y%m%d).zip" * \
            -x "*.git*" -x "README.md" -x "*.placeholder"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cepheus-Kernel-KSUN-SUSFS
          path: |
            Cepheus-KSUN-SUSFS-*.zip
            kernel/build.log
          retention-days: 7
